<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="フォアグラウンド実行ではシェルが次の入力を受け付けられなくなり、バックグラウンド実行ではすぐに次のコマンドを打てることを比較する図">
  <defs>
    <marker id="arrowfb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c2436" />
    </marker>
  </defs>

  <rect width="720" height="300" fill="#ffffff" />

  <text x="20" y="26" font-family="Georgia, serif" font-size="14" fill="#1c2436">フォアグラウンド実行（&amp;なし）</text>

  <rect x="20" y="38" width="300" height="30" rx="5" fill="#f4f6f9" stroke="#1c2436" stroke-width="1.2" />
  <text x="30" y="58" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#1c2436">$ python3 -m http.server 8000</text>

  <line x1="320" y1="53" x2="400" y2="53" stroke="#1c2436" stroke-width="1.6" marker-end="url(#arrowfb)" />

  <rect x="410" y="38" width="150" height="30" rx="5" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.4" />
  <text x="485" y="58" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1c2436">サーバー実行中</text>

  <rect x="20" y="80" width="540" height="26" rx="4" fill="none" stroke="#b23b3b" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="30" y="98" font-family="sans-serif" font-size="11.5" fill="#b23b3b">シェルはこの間、次の入力を受け付けられない（ブロックされる）</text>

  <line x1="485" y1="68" x2="485" y2="112" stroke="#5c6577" stroke-width="1.4" stroke-dasharray="2 3" />
  <text x="20" y="128" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#5c6577">（プロセスが終了して、ようやく次のプロンプトが出る）</text>

  <line x1="10" y1="150" x2="710" y2="150" stroke="#dbe0e8" stroke-width="1" />

  <text x="20" y="176" font-family="Georgia, serif" font-size="14" fill="#1c2436">バックグラウンド実行（&amp;あり）</text>

  <rect x="20" y="188" width="330" height="30" rx="5" fill="#f4f6f9" stroke="#1c2436" stroke-width="1.2" />
  <text x="30" y="208" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#1c2436">$ python3 -m http.server 8000 &amp;</text>

  <line x1="350" y1="203" x2="430" y2="203" stroke="#1c2436" stroke-width="1.6" marker-end="url(#arrowfb)" />

  <rect x="440" y="188" width="150" height="30" rx="5" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.4" />
  <text x="515" y="208" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1c2436">サーバー実行中</text>

  <rect x="20" y="230" width="330" height="30" rx="5" fill="#eef4ea" stroke="#5c7048" stroke-width="1.2" />
  <text x="30" y="250" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#1c2436">$ curl -v http://localhost:8000</text>
  <text x="460" y="250" font-family="sans-serif" font-size="11.5" fill="#5c7048">← すぐ次のコマンドを打てる</text>

  <text x="20" y="280" font-family="sans-serif" font-size="11.5" fill="#5c6577">サーバーは同じように裏で動き続けているが、シェルの「入力待ちの列」からは外れている</text>
</svg>
