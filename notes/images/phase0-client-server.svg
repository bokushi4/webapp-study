<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="クライアントがサーバーにリクエストを送り、サーバーがレスポンスを返す往復を示す図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c2436" />
    </marker>
  </defs>

  <rect width="680" height="240" fill="#ffffff" />

  <!-- Client box -->
  <rect x="30" y="75" width="180" height="90" rx="10" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.6" />
  <text x="120" y="103" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1c2436">Client</text>
  <text x="120" y="124" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a56b0">curl / ブラウザ</text>
  <text x="120" y="147" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c6577">要求する側</text>

  <!-- Server box -->
  <rect x="470" y="75" width="180" height="90" rx="10" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.6" />
  <text x="560" y="103" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1c2436">Server</text>
  <text x="560" y="124" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#3a56b0">python http.server :8000</text>
  <text x="560" y="147" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c6577">待ち受けて応答する側</text>

  <!-- request arrow: client -> server -->
  <line x1="212" y1="102" x2="466" y2="102" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="340" y="92" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1c2436">GET / HTTP/1.1</text>

  <!-- response arrow: server -> client -->
  <line x1="466" y1="150" x2="212" y2="150" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="340" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1c2436">200 OK</text>

  <text x="340" y="210" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#5c6577">サーバーは待ち受け続け、リクエストが来るたびにこの往復を繰り返す</text>
</svg>
