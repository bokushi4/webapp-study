<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="サーバープロセスが起動してから、待機と処理を繰り返すループに入る様子を示す図">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c2436" />
    </marker>
  </defs>

  <rect width="700" height="300" fill="#ffffff" />

  <!-- loop frame -->
  <rect x="190" y="55" width="470" height="200" rx="12" fill="none" stroke="#3a56b0" stroke-width="1.4" stroke-dasharray="5 4" />
  <text x="425" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a56b0">プロセスが終了するまで、ずっとこのループが回っている</text>

  <!-- start box -->
  <rect x="20" y="120" width="130" height="70" rx="8" fill="#f4f6f9" stroke="#1c2436" stroke-width="1.4" />
  <text x="85" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1c2436">起動</text>
  <text x="85" y="167" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#5c6577">http.server 8000</text>

  <!-- waiting box -->
  <rect x="220" y="120" width="170" height="70" rx="8" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.6" />
  <text x="305" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1c2436">待機中</text>
  <text x="305" y="164" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#3a56b0">:8000 で listen</text>

  <!-- process box -->
  <rect x="480" y="120" width="160" height="70" rx="8" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.6" />
  <text x="560" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1c2436">受信・処理・送信</text>
  <text x="560" y="164" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5c6577">1リクエスト分</text>

  <!-- start -> waiting -->
  <line x1="150" y1="155" x2="216" y2="155" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow2)" />

  <!-- waiting -> processing -->
  <line x1="392" y1="155" x2="476" y2="155" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow2)" />
  <text x="434" y="145" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1c2436">リクエスト到着</text>

  <!-- processing -> waiting (loop back) -->
  <path d="M 560 192 V 225 H 305 V 192" fill="none" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow2)" />
  <text x="434" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2436">送信し終えたら、また待機に戻る</text>
</svg>
