<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="クライアントがサーバーにリクエストを送り、サーバーがレスポンスを返す往復を示す図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c2436" />
    </marker>
  </defs>

  <rect width="680" height="200" fill="#ffffff" />

  <!-- Client box -->
  <rect x="40" y="45" width="190" height="110" rx="10" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.6" />
  <text x="135" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1c2436">Client</text>
  <text x="135" y="98" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3a56b0">curl / ブラウザ</text>
  <text x="135" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c6577">要求する側</text>

  <!-- Server box -->
  <rect x="450" y="45" width="190" height="110" rx="10" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.6" />
  <text x="545" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1c2436">Server</text>
  <text x="545" y="98" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#3a56b0">python http.server :8000</text>
  <text x="545" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c6577">待ち受けて応答する側</text>

  <!-- request arrow: client -> server -->
  <text x="340" y="73" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1c2436">GET / HTTP/1.1</text>
  <line x1="232" y1="85" x2="448" y2="85" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- response arrow: server -> client -->
  <line x1="448" y1="130" x2="232" y2="130" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="340" y="150" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1c2436">200 OK</text>

  <text x="340" y="185" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#5c6577">サーバーは待ち受け続け、リクエストが来るたびにこの往復を繰り返す</text>
</svg>
