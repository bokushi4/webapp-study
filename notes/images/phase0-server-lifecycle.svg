<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="サーバープロセスが起動してから、待機と処理を繰り返すループに入る様子を示す図">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c2436" />
    </marker>
  </defs>

  <rect width="700" height="250" fill="#ffffff" />

  <!-- loop frame -->
  <rect x="200" y="45" width="465" height="180" rx="12" fill="none" stroke="#3a56b0" stroke-width="1.4" stroke-dasharray="5 4" />
  <text x="432" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a56b0">プロセスが終了するまで、ずっとこのループが回っている</text>

  <!-- start box -->
  <rect x="25" y="100" width="130" height="70" rx="8" fill="#f4f6f9" stroke="#1c2436" stroke-width="1.4" />
  <text x="90" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1c2436">起動</text>
  <text x="90" y="147" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#5c6577">http.server 8000</text>

  <!-- waiting box -->
  <rect x="225" y="100" width="170" height="70" rx="8" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.6" />
  <text x="310" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1c2436">待機中</text>
  <text x="310" y="144" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#3a56b0">:8000 で listen</text>

  <!-- process box -->
  <rect x="485" y="100" width="160" height="70" rx="8" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.6" />
  <text x="565" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1c2436">受信・処理・送信</text>
  <text x="565" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5c6577">1リクエスト分</text>

  <!-- start -> waiting -->
  <line x1="155" y1="135" x2="221" y2="135" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow2)" />

  <!-- waiting -> processing -->
  <line x1="397" y1="135" x2="481" y2="135" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow2)" />
  <text x="439" y="123" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1c2436">リクエスト到着</text>

  <!-- processing -> waiting (loop back) -->
  <path d="M 565 172 V 197 H 310 V 172" fill="none" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrow2)" />
  <text x="439" y="211" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2436">送信し終えたら、また待機に戻る</text>
</svg>
