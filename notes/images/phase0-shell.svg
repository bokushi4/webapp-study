<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ターミナルという窓口の中でシェルというプロセスがコマンド文字列を解釈し、OSに新しいプロセスの起動を依頼する構造を示す図">
  <defs>
    <marker id="arrowsh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c2436" />
    </marker>
  </defs>

  <rect width="720" height="260" fill="#ffffff" />

  <!-- Terminal outer box -->
  <rect x="20" y="30" width="360" height="200" rx="12" fill="none" stroke="#5c6577" stroke-width="1.4" stroke-dasharray="5 4" />
  <text x="200" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5c6577">ターミナル（画面と入出力の窓口）</text>

  <!-- Shell inner box -->
  <rect x="50" y="90" width="300" height="100" rx="10" fill="#eef0fb" stroke="#3a56b0" stroke-width="1.6" />
  <text x="200" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c2436">シェル（zsh / bash）</text>
  <text x="200" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a56b0">コマンド文字列を解釈するプロセス</text>
  <text x="200" y="160" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#5c6577">$ python3 -m http.server 8000</text>

  <!-- arrow out to new process -->
  <line x1="352" y1="140" x2="448" y2="140" stroke="#1c2436" stroke-width="1.8" marker-end="url(#arrowsh)" />
  <text x="415" y="95" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1c2436">OSが仲介</text>
  <text x="415" y="110" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1c2436">起動を依頼</text>

  <!-- new process box, outside terminal -->
  <rect x="455" y="105" width="245" height="70" rx="10" fill="#f4f6f9" stroke="#1c2436" stroke-width="1.4" />
  <text x="577" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1c2436">新しいプロセス</text>
  <text x="577" y="152" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5c6577">http.serverのプロセス</text>

  <text x="360" y="245" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#5c6577">ターミナルはただの窓口。文字列の意味を理解し、実行するのはシェルというプロセス自身</text>
</svg>
